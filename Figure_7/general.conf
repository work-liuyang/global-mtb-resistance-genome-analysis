<colors>
<<include /mnt/project/software/mamba_env_liuyang/envs/circos/etc/colors.conf>>
</colors>

<fonts>
<<include /mnt/project/software/mamba_env_liuyang/envs/circos/etc/fonts.conf>>
</fonts>

<patterns>
<<include /mnt/project/software/mamba_env_liuyang/envs/circos/etc/patterns.conf>>
</patterns>

<image>
<<include /mnt/project/software/mamba_env_liuyang/envs/circos/etc/image.conf>>
</image>

text_format = none
karyotype = prepare_data/karyotype.txt
chromosomes_units = 1
chromosomes_display_default = yes

<ideogram>
<spacing>
default = 0.001r
</spacing>

show = no
radius           = 0.3r
thickness        = 3p
fill             = yes
stroke_color     = black
stroke_thickness = 0.5p
show_label       = no
label_font       = bold
label_radius     = dims(ideogram,radius) + 0.15r
label_size       = 9p
label_parallel   = yes
orientation      = inner

</ideogram>



<<ticks>
show_ticks       = no
show_tick_labels = no
</</ticks>

<plots>

<plot>
type = text
color = black
file = prepare_data/labels.txt
r1 = 1r+1500p
r0 = 1r
label_size = 9p
label_parallel = no
show_links = yes
#link_dims = 0p,0p,40p,0p,10p
link_dims = 4p,4p,8p,4p,4p
link_thickness=2p
link_color=red
orientation=in
label_snuggle=yes
max_snuggle_distance=5r
</plot>

<plot>
type = text
color = black
file = prepare_data/gene_label.txt
r0 = 0.90r
r1 = 0.98r+100p
#label_font = bolditalic
label_size = 9p
label_parallel = yes
show_links = no
link_dims = 0p,0p,30p,0p,10p
link_thickness=2p
link_color=red
orientation=in
label_snuggle=yes
max_snuggle_distance=3r
</plot>

<plot>
type = text
color = black
file = prepare_data/drug_label.txt
r0 = 0.75r
r1 = 0.80r+500p
#label_font = bolditalic
label_size = 9p
label_parallel = yes
label_snuggle=yes
max_snuggle_distance=5r
</plot>


<plot>
type = scatter
file = prepare_data/confidence.txt
r0 = 0.63r
r1 = 0.68r
color = lgreen
glyph      = circle
glyph_size = 9

